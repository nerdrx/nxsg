name: Publish VPM listing
on:
  push:
    branches: [main]
    paths: ['vpm/**', '.github/workflows/vpm-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vpm-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check listing and package downloads
        run: python3 scripts/verify-vpm.py vpm/index.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: vpm
      - name: Deploy listing
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
